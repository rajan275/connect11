<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect11 Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Animated Background Bubbles -->
  <div class="ambient-bubbles">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
    <div class="bubble bubble-5"></div>
  </div>

  <!-- Chat Container -->
  <div class="chat-container glass floating-chat">
    <h2>Connect11 Chat</h2>
    <div id="chatBox" class="chat-box"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type your message..." />

      <!-- icons: send, camera, more -->
      <button id="moreBtn" class="icon-btn" aria-label="more" title="More">
        <!-- three dots -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="5" cy="12" r="2" fill="currentColor" />
          <circle cx="12" cy="12" r="2" fill="currentColor" />
          <circle cx="19" cy="12" r="2" fill="currentColor" />
        </svg>
      </button>

      <button id="cameraBtn" class="icon-btn" aria-label="camera" title="Camera">
        <!-- camera icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 7H6L7 5H17L18 7H20C21.1 7 22 7.9 22 9V19C22 20.1 21.1 21 20 21H4C2.9 21 2 20.1 2 19V9C2 7.9 2.9 7 4 7Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button id="sendBtn" class="icon-btn send" aria-label="send" title="Send">
        <!-- paper-plane icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 2L11 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Attachments panel (hidden by default) -->
      <div id="attachmentsPanel" class="attachments" aria-hidden="true">
        <label for="fileInput" class="attach-option">📎 Attach file</label>
        <input type="file" id="fileInput" accept="image/*, video/*, audio/*" />
        <button id="closeAttachments" class="attach-close">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
